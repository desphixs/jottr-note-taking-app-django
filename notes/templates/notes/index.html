<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jottr — Your Digital Sticky Notes</title>
    <!-- Google Fonts link to import premium modern Outfit typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 font-sans text-slate-800 min-h-screen py-16 px-6 flex justify-center">
    <div class="max-w-5xl w-full">
        <!-- Main header for our note app workspace -->
        <header class="text-center mb-12">
            <h1
                class="text-5xl font-bold mb-3 tracking-tight bg-gradient-to-r from-blue-500 to-violet-600 bg-clip-text text-transparent">
                Jottr
            </h1>
            <p class="text-slate-500 text-lg font-light">
                Simplicity in every thought. Your digital sticky note wall.
            </p>
        </header>

        <!-- Dynamic note cards container (looping through our context database list) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
            <!-- We use a Django Template Language {percent for percent} loop to process each note item sequentially! -->
            {% for note in notes %}
            <div
                class="group bg-white rounded-2xl p-6 shadow-sm border border-slate-100 hover:shadow-md hover:-translate-y-1 transition-all duration-300 relative overflow-hidden flex flex-col justify-between">
                <!-- Top accent border line using the note's custom color attribute dynamically -->
                <div
                    class="absolute top-0 left-0 w-full h-[6px] bg-gradient-to-r from-{{ note.color }}-500 to-{{ note.color }}-400">
                </div>

                <div>
                    <!-- The group-hover transition dynamically highlights our title in the note's customized theme color! -->
                    <h3
                        class="text-xl font-semibold text-slate-800 mb-3 group-hover:text-{{ note.color }}-600 transition-colors duration-300">
                        {{ note.title }}
                    </h3>
                    <p class="text-slate-500 text-sm leading-relaxed mb-6">
                        {{ note.content }}
                    </p>
                </div>

                <div
                    class="flex justify-between items-center text-xs text-slate-400 border-t border-dashed border-slate-100 pt-4 mt-auto">
                    <span>{{ note.created_at }}</span>
                    <span class="bg-slate-50 text-slate-600 px-3 py-1 rounded-full font-medium">
                        {{ note.tag }}
                    </span>
                </div>
            </div>
            <!-- The {percent empty percent} block handles the fallback state beautifully if our list is clean and empty! -->
            {% empty %}
            <div class="col-span-full text-center py-12">
                <p class="text-slate-400 text-lg">No notes found. Your digital sticky-note wall is clean and empty!</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
