<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dynamic page title block with default value fallback -->
    <title>{% block title %}Jottr — Your Beautiful Sticky Note Wall{% endblock %}</title>
    <!-- Google Fonts & Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900 py-16 px-4">
    <div class="max-w-6xl mx-auto">
        <!-- Master Site-Wide Header Branding Portal -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6 mb-16 pb-8 border-b border-slate-100">
            <!-- Sleek clickable brand banner linking home -->
            <a href="{% url 'notes:note_list' %}" class="flex items-center gap-3 group transition-transform active:scale-95 duration-200">
                <!-- Interactive rotate logo badge on group hover -->
                <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-md shadow-indigo-100 group-hover:rotate-12 transition-transform duration-300">
                    J
                </div>
                <div>
                    <h1 class="text-3xl font-black tracking-tight text-slate-800">Jottr</h1>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mt-0.5">Master Blueprint Sandbox</p>
                </div>
            </a>

            <!-- Flexible header action buttons slot, defaulting to "New Sticky Note" -->
            <div class="flex items-center gap-3">
                {% block header_actions %}
                <!-- Dynamic transition link carrying users straight to note creation form -->
                <a href="{% url 'notes:create_note' %}"
                    class="inline-flex items-center gap-2 px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold rounded-2xl shadow-sm hover:shadow-md transition-all duration-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    New Sticky Note
                </a>
                {% endblock %}
            </div>
        </header>

        <!-- Main dynamic page-specific workspace slot -->
        <main>
            {% block content %}{% endblock %}
        </main>

        <!-- Site-Wide Footer Details -->
        <footer class="mt-20 pt-8 border-t border-slate-100 text-center text-xs text-slate-400">
            <p>© {% now "Y" %} Jottr — Built with passion in Django & Tailwind CSS.</p>
        </footer>
    </div>
</body>

</html>
