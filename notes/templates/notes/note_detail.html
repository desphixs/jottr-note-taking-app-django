<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ note.title }} — Jottr</title>
    <!-- We load TailwindCSS to give our page a premium, modern, startup-grade aesthetic right out of the box! -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900 py-16 px-4">
    <div class="max-w-2xl mx-auto">
        <!-- Back navigation link styled in clean minimalist indigo with a subtle sliding arrow animation -->
        <a href="{% url 'notes:note_list' %}"
            class="inline-flex items-center text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors mb-8 group">
            <svg class="w-4 h-4 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Dashboard
        </a>

        <!-- Large, beautiful detailed sticky note card -->
        <article class="bg-white rounded-3xl p-8 md:p-12 shadow-sm border border-slate-100 relative overflow-hidden">
            <!-- Top accent border line using our signature solid premium indigo theme -->
            <div class="absolute top-0 left-0 w-full h-[8px] bg-indigo-600"></div>

            <header class="mb-8">
                <!-- Flex header container displaying status badge and action button group -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <!-- Visual status badge indicating we are looking at an individual detailed Note record -->
                    <span class="self-start bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase inline-block">
                        Active Note
                    </span>
                    <!-- Action Buttons Group -->
                    <div class="flex items-center gap-3">
                        <!-- Sleek edit button linking directly to the edit_note view -->
                        <a href="{% url 'notes:edit_note' note.pk %}"
                            class="inline-flex items-center gap-1.5 px-4 py-2.5 bg-slate-50 hover:bg-indigo-50 hover:text-indigo-600 active:scale-95 text-slate-500 font-semibold rounded-xl text-xs shadow-sm hover:shadow transition-all duration-300 group">
                            <svg class="w-3.5 h-3.5 group-hover:scale-110 transition-transform duration-300" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                            </svg>
                            Edit Note
                        </a>
                        <!-- Sleek delete button linking directly to the delete_note view -->
                        <a href="{% url 'notes:delete_note' note.pk %}"
                            class="inline-flex items-center gap-1.5 px-4 py-2.5 bg-slate-50 hover:bg-rose-50 hover:text-rose-600 active:scale-95 text-slate-500 font-semibold rounded-xl text-xs shadow-sm hover:shadow transition-all duration-300 group">
                            <svg class="w-3.5 h-3.5 group-hover:scale-110 transition-transform duration-300" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            Delete Note
                        </a>
                    </div>
                </div>

                <!-- Displaying the real, full database title field of our queried note -->
                <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight leading-tight">
                    {{ note.title }}
                </h1>
            </header>

            <!-- Displaying the real, detailed note description. whitespace-pre-line preserves spacing and line breaks beautifully! -->
            <section class="text-slate-600 text-lg leading-relaxed whitespace-pre-line mb-8 border-t border-slate-100 pt-8">
                {{ note.content }}
            </section>

            <!-- Card footer displaying our exact SQLite timestamp, formatted into a elegant date and time stamp -->
            <footer class="flex items-center justify-between text-xs text-slate-400 border-t border-dashed border-slate-100 pt-6">
                <div class="flex items-center">
                    <svg class="w-4 h-4 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span>Created on {{ note.created_at|date:"F j, Y \a\t g:i a" }}</span>
                </div>
                <span class="font-mono text-[10px] bg-slate-50 text-slate-500 px-2 py-1 rounded">
                    ID: #{{ note.pk }}
                </span>
            </footer>
        </article>
    </div>
</body>

</html>
